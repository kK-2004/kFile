[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "content-center-sdk"
version = "0.1.0"
description = "Synchronous Python SDK for the k-File content center open API"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]
