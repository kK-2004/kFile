# 本地仅保留 Nacos 接入配置；业务配置全部托管在 Nacos：
#   dev  → Data ID kfile-dev.yaml（见 application-dev.yml）
#   prod → Data ID kfile.yaml（见 application-prod.yml）
# 配置内容的仓库备份见 docs/nacos/。
spring:
  application:
    name: kfile
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        file-extension: yaml
        refresh-enabled: true
      discovery:
        enabled: false
